url: https://github.com/rivenshanghai/dsh-toomuch-plugins
name: rivenshanghai/dsh-toomuch-plugins
category: ui
description.en: Collapses the global panel entries above the workspace in the DSH Web sidebar into a single toggle in the sidebar footer; entry display (icons-only grid, icon size, order, entries kept while collapsed) and project filters (favorites only, last n days, latest m) are configured in the Settings left nav.
description.zh: 把 DSH Web 侧栏里工作区上方的全局面板入口收成侧栏底部的一个开关；入口显示方式（纯图标网格、图标尺寸、顺序、收起保留数）与项目筛选（只看最爱、最近 n 天、最新 m 个）都在设置的左侧菜单里配置。
