# dsh-toomuch-plugins DSH plugin — bundle patch: insert the plugin row (deployment-global).
#
# The plugin ships as the package `dsh-toomuch-plugins` (this repository root,
# also published to npm): this row tells the profile to load that package.
# The Host half is src/index.js, the Client half src/client.js.
# There is nothing to configure — the toggle has no options.
- insert:
    - id: dsh-toomuch-plugins
      name: dsh-toomuch-plugins
